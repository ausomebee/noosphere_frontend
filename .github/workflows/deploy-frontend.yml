name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - pre-prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      #########################################################
      # CHECKOUT REPOSITORY
      #########################################################

      - name: Checkout code
        uses: actions/checkout@v4

      #########################################################
      # DETERMINE ENVIRONMENT
      #########################################################

      - name: Set deployment environment
        id: env
        run: |
          BRANCH=${GITHUB_REF##*/}

          if [ "$BRANCH" = "develop" ]; then
            echo "host=${{ secrets.DEV_EC2_HOST_FRONTEND }}" >> $GITHUB_OUTPUT

            echo "ssh_key<<EOF" >> $GITHUB_OUTPUT
            echo "${{ secrets.DEV_EC2_SSH_KEY_FRONTEND }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "environment=development" >> $GITHUB_OUTPUT

          elif [ "$BRANCH" = "pre-prod" ]; then
            echo "host=${{ secrets.PREPROD_EC2_HOST_FRONTEND }}" >> $GITHUB_OUTPUT

            echo "ssh_key<<EOF" >> $GITHUB_OUTPUT
            echo "${{ secrets.PREPROD_EC2_SSH_KEY_FRONTEND }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "environment=preprod" >> $GITHUB_OUTPUT

          elif [ "$BRANCH" = "master" ]; then
            echo "host=${{ secrets.PROD_EC2_HOST_FRONTEND }}" >> $GITHUB_OUTPUT

            echo "ssh_key<<EOF" >> $GITHUB_OUTPUT
            echo "${{ secrets.PROD_EC2_SSH_KEY_FRONTEND }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      #########################################################
      # SETUP NODE
      #########################################################

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      #########################################################
      # BUILD CLIENT
      #########################################################

      - name: Install, test & build client
        working-directory: ./client
        env:
          VITE_API_URL: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_VITE_API_URL || github.ref == 'refs/heads/pre-prod' && secrets.PREPROD_VITE_API_URL || secrets.PROD_VITE_API_URL }}
        run: |
          npm ci
          npm test
          npm run build

      #########################################################
      # BUILD CONTROL
      #########################################################

      - name: Install, test & build control
        working-directory: ./control
        env:
          VITE_API_URL: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_VITE_API_URL || github.ref == 'refs/heads/pre-prod' && secrets.PREPROD_VITE_API_URL || secrets.PROD_VITE_API_URL }}
          VITE_STRIPE_PK: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_VITE_STRIPE_PK || github.ref == 'refs/heads/pre-prod' && secrets.PREPROD_VITE_STRIPE_PK || secrets.PROD_VITE_STRIPE_PK }}
          VITE_PAYPAL_CLIENT_ID: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_VITE_PAYPAL_CLIENT_ID || github.ref == 'refs/heads/pre-prod' && secrets.PREPROD_VITE_PAYPAL_CLIENT_ID || secrets.PROD_VITE_PAYPAL_CLIENT_ID }}
        run: |
          npm ci
          npm test
          npm run build

      #########################################################
      # BUILD TENANT
      #########################################################

      - name: Install, test & build tenant
        working-directory: ./tenant
        env:
          VITE_API_URL: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_VITE_API_URL || github.ref == 'refs/heads/pre-prod' && secrets.PREPROD_VITE_API_URL || secrets.PROD_VITE_API_URL }}
        run: |
          npm ci
          npm test
          npm run build

      #########################################################
      # LINT (non-blocking)
      #
      # Surfaces lint regressions in the CI log without blocking a deploy while
      # the existing backlog is worked down. Node modules are already installed
      # by the build steps above. Once each app reaches zero errors, drop its
      # `continue-on-error: true` to make lint a required gate.
      #########################################################

      - name: Lint client
        working-directory: ./client
        continue-on-error: true
        run: npm run lint

      - name: Lint control
        working-directory: ./control
        continue-on-error: true
        run: npm run lint

      - name: Lint tenant
        working-directory: ./tenant
        continue-on-error: true
        run: npm run lint

      #########################################################
      # PREPARE SERVER DIRECTORIES
      #########################################################

      - name: Prepare target directories on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.env.outputs.host }}
          username: ec2-user
          key: ${{ steps.env.outputs.ssh_key }}
          script: |
            sudo mkdir -p /var/www/client
            sudo mkdir -p /var/www/control
            sudo mkdir -p /var/www/tenant

            sudo chown -R ec2-user:ec2-user /var/www

            sudo rm -rf /var/www/client/*
            sudo rm -rf /var/www/control/*
            sudo rm -rf /var/www/tenant/*

      #########################################################
      # UPLOAD CLIENT BUILD
      #########################################################

      - name: Upload client to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.env.outputs.host }}
          username: ec2-user
          key: ${{ steps.env.outputs.ssh_key }}
          source: "client/dist/**"
          target: "/var/www/client"
          strip_components: 2

      #########################################################
      # UPLOAD CONTROL BUILD
      #########################################################

      - name: Upload control to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.env.outputs.host }}
          username: ec2-user
          key: ${{ steps.env.outputs.ssh_key }}
          source: "control/dist/**"
          target: "/var/www/control"
          strip_components: 2

      #########################################################
      # UPLOAD TENANT BUILD
      #########################################################

      - name: Upload tenant to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.env.outputs.host }}
          username: ec2-user
          key: ${{ steps.env.outputs.ssh_key }}
          source: "tenant/dist/**"
          target: "/var/www/tenant"
          strip_components: 2

      #########################################################
      # ADD ROOT HEALTH ROUTE + VERIFY CONFIG + RELOAD
      #########################################################

      - name: Fix nginx config & add health route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.env.outputs.host }}
          username: ec2-user
          key: ${{ steps.env.outputs.ssh_key }}
          script: |
            set -e
            CONF=/etc/nginx/conf.d/frontend.conf
            sudo cp "$CONF" "$CONF.bak"
            # 1) Remove any existing health block (single- or multi-line) so this
            #    step is idempotent and never stacks duplicate "location = /" blocks.
            sudo awk '/# Liveness probe at root/{next} /location[[:space:]]*=[[:space:]]*\/[[:space:]]*\{/{ if($0 ~ /\}/){next} inblk=1; next } inblk{ if($0 ~ /\}/){inblk=0} next } {print}' "$CONF" > /tmp/frontend.noh.conf
            # 2) Insert a server-level "/" health route right after the first
            #    `server {` (valid placement, not inside another location block).
            awk '!done && /^[[:space:]]*server[[:space:]]*\{/ { print; print "    # Liveness probe at root"; print "    location = / {"; print "        return 200 \"OK\";"; print "        add_header Content-Type text/plain;"; print "    }"; done=1; next } {print}' /tmp/frontend.noh.conf > /tmp/frontend.h.conf
            sudo cp /tmp/frontend.h.conf "$CONF"
            sudo rm -f /tmp/frontend.noh.conf /tmp/frontend.h.conf
            sudo nginx -t
            sudo systemctl reload nginx

      #########################################################
      # SUCCESS MESSAGE
      #########################################################

      - name: Deployment completed
        run: |
          echo "Frontend deployed successfully to ${{ steps.env.outputs.environment }}"
