name: Deploy Frontend to Dev Server

on:
  push:
    branches:
      - develop
      - pre-prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Test & build client
      - name: Install, test & build client
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm test
          npm run build

      # Test & build control
      - name: Install, test & build control
        working-directory: ./control
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PK: ${{ secrets.VITE_STRIPE_PK }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
        run: |
          npm ci
          npm test
          npm run build

      # Test & build tenant
      - name: Install, test & build tenant
        working-directory: ./tenant
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm test
          npm run build

            # Clean target dirs on EC2 before uploading
      - name: Clean target dirs on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/client/*
            sudo rm -rf /var/www/control/*
            sudo rm -rf /var/www/tenant/*

      # Upload client/dist -> /var/www/client
      - name: Upload client to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "client/dist/**"
          target: "/var/www/client"
          strip_components: 2

      # Upload control/dist -> /var/www/control
      - name: Upload control to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "control/dist/**"
          target: "/var/www/control"
          strip_components: 2

      # Upload tenant/dist -> /var/www/tenant
      - name: Upload tenant to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "tenant/dist/**"
          target: "/var/www/tenant"
          strip_components: 2

      # Reload nginx
      - name: Reload nginx on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
