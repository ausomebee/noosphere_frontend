name: Deploy Frontend to Dev Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Build Client app
      - name: Install & build Client
        working-directory: ./Client
        run: |
          npm ci
          npm run build

      # Build Control app
      - name: Install & build Control
        working-directory: ./Control
        run: |
          npm ci
          npm run build

      # Build Tenant app
      - name: Install & build Tenant
        working-directory: ./Tenant
        run: |
          npm ci
          npm run build

      # Upload Client/dist -> /var/www/client
      - name: Upload Client to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Client/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_PATH }}/client"

      # Upload Control/dist -> /var/www/control
      - name: Upload Control to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Control/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_PATH }}/control"

      # Upload Tenant/dist -> /var/www/tenant
      - name: Upload Tenant to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Tenant/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_PATH }}/tenant"

      # Reload nginx after deploy
      - name: Reload nginx on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
